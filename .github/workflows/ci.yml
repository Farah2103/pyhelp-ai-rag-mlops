name: PyHelp quality gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fast-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m scripts.verify
      - run: python -m compileall -q src api monitoring scripts
      - run: python -m pytest tests -q --junitxml=reports/junit.xml
      - run: python -m scripts.gates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.python-version }}
          path: reports/junit.xml
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pip-audit==2.8.0
      # Fails on known unhandled vulnerabilities. Requires package/advisory network.
      - run: python -m pip_audit -r requirements-ci.txt --progress-spinner off
