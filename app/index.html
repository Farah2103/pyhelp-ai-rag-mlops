<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PyHelp AI</title>
<style>body{font:17px system-ui;background:#f4f6fa;color:#18304b;max-width:850px;margin:50px auto;padding:20px}textarea{width:95%;padding:14px;font:inherit;border:1px solid #a3b3c5;border-radius:8px}button{background:#17605a;color:white;padding:12px 25px;border:0;border-radius:6px;cursor:pointer}article{white-space:pre-wrap;background:white;padding:25px;margin-top:20px;border-radius:10px}small{display:block;margin:12px 0}pre{white-space:pre-wrap}</style>
<h1>PyHelp AI</h1><p>Support documentaire Python 3.11.18 · Français / English</p><small>Les réponses peuvent être inexactes. Vérifiez les extraits cités. Aucune exécution de code.</small>
<form id="form"><textarea id="q" rows="4" maxlength="2000" required placeholder="Comment créer un environnement virtuel ?"></textarea><p><button id="send">Poser la question</button></p></form><article id="answer" aria-live="polite">Prêt.</article><section id="sources"></section>
<script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let b=document.querySelector('#send'),a=document.querySelector('#answer'),s=document.querySelector('#sources');b.disabled=true;s.replaceChildren();a.textContent='Recherche et génération…';try{let r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.querySelector('#q').value})});let x=await r.json();if(!r.ok)throw Error(typeof x.detail==='string'?x.detail:JSON.stringify(x.detail));a.textContent=x.answer+'\n\n'+x.status+' · '+x.latency_ms.toFixed(0)+' ms';for(let ref of x.references){let d=document.createElement('details'),title=document.createElement('summary'),p=document.createElement('pre');title.textContent=ref.source_path+' · '+ref.section+' · '+ref.chunk_id;p.textContent=ref.text;d.append(title,p);s.append(d)}}catch(e){a.textContent='Erreur : '+e.message}finally{b.disabled=false}};</script></html>
